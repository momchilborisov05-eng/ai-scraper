name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      ANTHROPIC_API_KEY: ""          # tests use a fake Claude client and never call the API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests with coverage
        run: pytest --cov=ai_scraper --cov-report=term-missing --cov-fail-under=80
      - name: Benchmark (smoke run, offline extractors)
        if: matrix.python == '3.12'
        run: python scripts/benchmark.py --smoke

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ai-scraper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container and exercise the API
        run: |
          docker run -d --name app -p 8000:8000 ai-scraper:ci
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/api/fixtures | grep -q '"books"'
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"fixture":"books","request":"title, price, rating (1-5), in stock (yes/no)","mode":"heuristic","pages":3}' \
            http://localhost:8000/api/extract | grep -q '"rows"'
          test "$(docker inspect -f '{{.Config.User}}' app)" = "app"
      - if: always()
        run: docker logs app || true
